[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build-backend"

[project]
name = "taurlm"
version = "0.1.0"
description = "TauRLM - RLM-based AI coding agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
